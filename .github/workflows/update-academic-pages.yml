name: Update conferences and funding

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "15 11 * * *"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/update-academic-pages.yml"

permissions:
  contents: write

concurrency:
  group: update-academic-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-academic.txt

      - name: Update conference and funding pages
        run: python scripts/update_all.py

      - name: Commit generated pages and data
        shell: bash
        run: |
          git config user.name "academic-opportunities-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add conf.html fund.html data/conferences.json data/funding.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automatically update conferences and funding"
          git push origin HEAD:${{ github.event.repository.default_branch }}
